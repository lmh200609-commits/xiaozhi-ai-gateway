<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频播放</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>

  <video id="videoPlayer" autoplay controls></video>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("video_url");
    const videoEl = document.getElementById("videoPlayer");

    if (videoUrl) {
      videoEl.src = videoUrl;
      videoEl.play().catch(e => console.log("Autoplay note:", e));

      // Auto request fullscreen on first user gesture or immediately
      function tryFullscreen() {
        const el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      }

      // Try fullscreen immediately (may require user gesture in some browsers)
      tryFullscreen();

      // Also try on first click anywhere
      document.addEventListener("click", function handler() {
        tryFullscreen();
        document.removeEventListener("click", handler);
      });

      // When video ends, close the window/tab after a short delay
      videoEl.addEventListener("ended", () => {
        setTimeout(() => {
          try { window.close(); } catch(e) {}
        }, 800);
      });
    } else {
      document.body.innerHTML = '<div style="color:#fff;display:flex;align-items:center;justify-content:center;height:100%;font-size:24px;">未指定视频文件</div>';
    }

    // Close on ESC
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        try { document.exitFullscreen(); } catch(e) {}
        try { window.close(); } catch(e) {}
      }
    });
  </script>
</body>
</html>
